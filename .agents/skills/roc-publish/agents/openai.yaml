interface:
  display_name: "ROC Publish"
  short_description: "Run the GitHub Issue to PR publication flow"
  default_prompt: "Use $roc-publish to turn the current Rocky-project repository changes into a scoped GitHub Issue with matching labels and milestone, then create a fresh issue branch from develop, move only the related work onto that branch, push it, open the PR, update the issue, and close it after merge if automation does not."
