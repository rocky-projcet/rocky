name: Rocky dual Windows and macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package and publish, such as v0.1.4
        required: true
        type: string
      cleanup_public_v014:
        description: Delete only the backed-up public v0.1.4 Release and tag before reissuing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rocky-dual-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  cleanup-public-v014:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_public_v014 == true }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Verify the exact backed-up public v0.1.4 targets
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v0.1.4"
          test -n "$PUBLIC_RELEASE_TOKEN"
          release_id="$(curl -fsS \
            -H "Authorization: Bearer $PUBLIC_RELEASE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/rocky-projcet/rocky-release/releases/tags/$RELEASE_TAG" | jq -r '.id')"
          test "$release_id" = "367467850"
          object_sha="$(curl -fsS \
            -H "Authorization: Bearer $PUBLIC_RELEASE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/rocky-projcet/rocky-release/git/ref/tags/$RELEASE_TAG" | jq -r '.object.sha')"
          test "$object_sha" = "cad845f6c87ecd676b68288591644f1ab654b779"

      - name: Delete the exact public v0.1.4 Release
        run: |
          set -euo pipefail
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $PUBLIC_RELEASE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/rocky-projcet/rocky-release/releases/367467850

      - name: Delete the exact public v0.1.4 tag
        run: |
          set -euo pipefail
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $PUBLIC_RELEASE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/rocky-projcet/rocky-release/git/refs/tags/v0.1.4

  windows-package:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cleanup_public_v014 != true }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out the tagged source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the Windows installer once
        shell: powershell
        run: npm run release:windows:installer -- -Tag $env:RELEASE_TAG

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocky-release-windows-${{ env.RELEASE_TAG }}
          path: releases/${{ env.RELEASE_TAG }}
          if-no-files-found: error

  macos-package:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cleanup_public_v014 != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            architecture: x64
          - runner: macos-14
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out the tagged source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Confirm runner architecture
        run: test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"

      - name: Build application payload
        run: |
          npm run build --silent
          npm --prefix web run build --silent

      - name: Run focused macOS packaging tests
        run: |
          node --test dist/test/electron/macos-app-bundle.test.js dist/test/electron/macos-release-contracts.test.js

      - name: Build macOS artifacts once
        run: npm run release:macos -- --tag "$RELEASE_TAG" --skip-build

      - name: Verify macOS artifact names
        run: |
          test -s "releases/$RELEASE_TAG/rocky-$RELEASE_TAG-macos-${{ matrix.architecture }}.app.zip"
          test -s "releases/$RELEASE_TAG/rocky-$RELEASE_TAG-macos-${{ matrix.architecture }}.dmg"
          test -s "releases/$RELEASE_TAG/rocky-$RELEASE_TAG-macos-${{ matrix.architecture }}.pkg"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocky-release-macos-${{ matrix.architecture }}-${{ env.RELEASE_TAG }}
          path: releases/${{ env.RELEASE_TAG }}
          if-no-files-found: error

  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cleanup_public_v014 != true }}
    needs:
      - windows-package
      - macos-package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out the tagged source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rocky-release-*
          path: releases/${{ env.RELEASE_TAG }}
          merge-multiple: true

      - name: List release inputs
        run: find "releases/$RELEASE_TAG" -maxdepth 1 -type f -print | sort

      - name: Publish matching private and public Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: npm run release:dual -- --tag "$RELEASE_TAG"
